[project]
name = "hackknight-2026-financial"
version = "0.1.0"
description = "Financial signals ingestion layer (news_api and friends)"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "newsapi-python==0.2.7",
    "pydantic>=2.9",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.4",
    "websockets>=17.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
